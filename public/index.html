<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现场喷房勘测</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      padding: 16px;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
      color: #1a73e8;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8f0fe;
    }
    .subsection {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin: 16px 0 10px;
      padding-left: 8px;
      border-left: 3px solid #1a73e8;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }
    label .required { color: #e53935; }
    label .optional { color: #999; font-weight: normal; font-size: 12px; }
    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }
    textarea { resize: vertical; min-height: 55px; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .hint {
      font-size: 11px;
      color: #aaa;
      margin-top: 3px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      z-index: 1000;
      display: none;
    }
    .toast.success { background: #43a047; }
    .toast.error { background: #e53935; }
    .photo-note {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 7px;
      padding: 10px 12px;
      font-size: 12px;
      color: #f57f17;
      margin-bottom: 14px;
    }
    /* 图片上传 */
    .upload-section {
      margin-bottom: 20px;
    }
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafafa;
    }
    .upload-area:hover {
      border-color: #1a73e8;
      background: #f0f7ff;
    }
    .upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
    .upload-area .upload-text { font-size: 13px; color: #555; font-weight: 500; }
    .upload-area .upload-hint { font-size: 11px; color: #999; margin-top: 4px; }
    .upload-area input[type="file"] { display: none; }
    .thumb-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .thumb-item {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .thumb-del {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-del:hover { background: rgba(229,57,53,0.9); }
    .img-preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .img-preview-modal.active { display: flex; }
    .img-preview-modal img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .img-preview-modal .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }
    /* 条件选填 */
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .radio-group input[type="radio"] { width: 16px; height: 16px; cursor: pointer; }
    .conditional-section {
      display: none;
      margin-top: 8px;
    }
    .conditional-section.visible { display: block; }
    .invalid-page {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    .invalid-page .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .invalid-page h2 {
      color: #e53935;
      margin-bottom: 12px;
    }
    .invalid-page p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    .customer-banner {
      background: #e8f0fe;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #1a73e8;
      text-align: center;
    }
    .customer-banner strong { color: #0d47a1; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- 无效链接页面 -->
  <div class="invalid-page" id="invalidPage">
    <div class="container">
      <div class="icon">🔒</div>
      <h2>链接无效</h2>
      <p>您访问的链接无效或已失效。<br>请联系管理员获取有效的专属勘测链接。</p>
    </div>
  </div>

  <!-- 表单页面 -->
  <div class="container" id="formContainer" style="display:none;">
    <h1>现场喷房勘测</h1>
    <div class="subtitle">On-site Spray Booth Survey</div>
    <div class="customer-banner" id="customerBanner"></div>
    
    <form id="surveyForm">
      <input type="hidden" name="invite_code" id="inviteCode">
      <!-- 一、现场概述 -->
      <div class="section">
        <div class="section-title">一、现场概述</div>
        
        <div class="form-group">
          <label>勘测名称 <span class="required">*</span></label>
          <input type="text" name="survey_name" placeholder="如：某某4S店喷房勘测" required>
        </div>
        
        <div class="form-group">
          <label>现场地理位置 <span class="required">*</span></label>
          <textarea name="location" placeholder="例：中国浙江省台州市温岭市泽国镇泽楚路926号2幢" required></textarea>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>主要喷涂车型</label>
            <input type="text" name="main_vehicle_types" placeholder="例：奔驰、奥迪、特斯拉">
          </div>
          <div class="form-group">
            <label>喷房加热方式</label>
            <input type="text" name="heating_method" placeholder="例：顶部热源或电加热">
          </div>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>喷房最高气压</label>
            <input type="text" name="max_air_pressure" placeholder="例：8bar">
          </div>
          <div class="form-group">
            <label>喷房最高温度</label>
            <input type="text" name="max_temperature" placeholder="例：60℃">
          </div>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>地板/楼板厚度</label>
            <input type="text" name="floor_thickness" placeholder="例：100mm">
          </div>
          <div class="form-group">
            <label>喷房所在楼层</label>
            <input type="text" name="booth_level" placeholder="例：一楼 / 三楼">
          </div>
        </div>
        
        <div class="form-group">
          <label>现场是否有货梯（设备运输用）</label>
          <div class="radio-group">
            <label><input type="radio" name="has_elevator" value="yes" onchange="toggleSection('elevator', true)"> 有</label>
            <label><input type="radio" name="has_elevator" value="no" onchange="toggleSection('elevator', false)" checked> 无</label>
          </div>
          <div class="conditional-section" id="elevatorSection">
            <input type="text" name="elevator_dimensions" placeholder="电梯内部尺寸，例：5450×2255mm">
          </div>
        </div>
        
        <div class="form-group">
          <label>喷房地下有无钢筋、水管和电线</label>
          <input type="text" name="underground_utilities" placeholder="例：无 / 有钢筋">
        </div>

        <!-- 喷房现场照片 -->
        <div class="upload-section">
          <label>喷房内部及四周照片 <span class="required">*</span></label>
          <div class="upload-area" onclick="document.getElementById('boothPhotos').click()">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽上传喷房现场照片</div>
            <div class="upload-hint">建议拍摄：大门全景、内部全景、底部格栅、立柱结构</div>
            <input type="file" id="boothPhotos" accept="image/*" multiple onchange="handlePhotoUpload(this, 'booth')">
          </div>
          <div class="thumb-list" id="boothThumbList"></div>
        </div>

        <!-- 控制柜安装位置 -->
        <div class="subsection">控制柜安装位置（控制柜尺寸：2000×440×265mm）</div>
        
        <div class="row">
          <div class="form-group">
            <label>安装电柜处宽度</label>
            <input type="text" name="cabinet_install_width" placeholder="例：500mm">
            <div class="hint">墙面到喷房门铰链的距离</div>
          </div>
          <div class="form-group">
            <label>喷房小门位置</label>
            <input type="text" name="aux_door_position" placeholder="例：左后（站在喷房外正对大门）">
          </div>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>门与前墙面距离</label>
            <input type="text" name="door_to_front_wall" placeholder="例：xxx mm">
          </div>
          <div class="form-group">
            <label>门宽</label>
            <input type="text" name="door_width" placeholder="例：760mm">
          </div>
        </div>

        <!-- 墙面烤灯位置 -->
        <div class="subsection">墙面烤灯位置</div>
        <div class="radio-group">
          <label><input type="radio" name="has_lamp" value="yes" onchange="toggleSection('lamp', true)"> 有</label>
          <label><input type="radio" name="has_lamp" value="no" onchange="toggleSection('lamp', false)" checked> 无</label>
        </div>
        <div class="conditional-section" id="lampSection">
        
        <div class="row-3">
          <div class="form-group">
            <label>烤灯下沿至格栅面高度</label>
            <input type="text" name="lamp_lower_height" placeholder="例：510mm">
          </div>
          <div class="form-group">
            <label>烤灯上沿至格栅面高度</label>
            <input type="text" name="lamp_upper_height" placeholder="例：1070mm">
          </div>
          <div class="form-group">
            <label>烤灯宽度</label>
            <input type="text" name="lamp_width" placeholder="例：145mm">
          </div>
        </div>
        
        <div class="row-3">
          <div class="form-group">
            <label>前墙面与烤灯距离</label>
            <input type="text" name="front_wall_to_lamp" placeholder="例：1500mm">
          </div>
          <div class="form-group">
            <label>烤灯间距1</label>
            <input type="text" name="lamp_to_lamp_1" placeholder="例：200mm">
          </div>
          <div class="form-group">
            <label>烤灯间距2</label>
            <input type="text" name="lamp_to_lamp_2" placeholder="例：200mm">
          </div>
        </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>气源位置</label>
            <input type="text" name="air_supply_location" placeholder="描述气源接口位置">
          </div>
          <div class="form-group">
            <label>220V电源位置</label>
            <input type="text" name="power_supply_location" placeholder="描述电源插座位置">
          </div>
        </div>

        <!-- 气源/电源照片 -->
        <div class="row">
          <div class="form-group">
            <label>气源点位照片</label>
            <div class="upload-area" onclick="document.getElementById('airPhotos').click()" style="padding:14px;">
              <div class="upload-icon" style="font-size:22px;">📷</div>
              <div class="upload-text" style="font-size:12px;">上传气源接口照片</div>
              <input type="file" id="airPhotos" accept="image/*" multiple onchange="handlePhotoUpload(this, 'air')">
            </div>
            <div class="thumb-list" id="airThumbList"></div>
          </div>
          <div class="form-group">
            <label>电源点位照片</label>
            <div class="upload-area" onclick="document.getElementById('powerPhotos').click()" style="padding:14px;">
              <div class="upload-icon" style="font-size:22px;">📷</div>
              <div class="upload-text" style="font-size:12px;">上传电源插座照片</div>
              <input type="file" id="powerPhotos" accept="image/*" multiple onchange="handlePhotoUpload(this, 'power')">
            </div>
            <div class="thumb-list" id="powerThumbList"></div>
          </div>
        </div>
      </div>

      <!-- 二、喷房内部尺寸 -->
      <div class="section">
        <div class="section-title">二、喷房内部尺寸</div>
        
        <div class="row">
          <div class="form-group">
            <label>内部高度</label>
            <input type="text" name="interior_height" placeholder="例：3000mm">
          </div>
          <div class="form-group">
            <label>灯具底部至格栅高度</label>
            <input type="text" name="light_to_grate_height" placeholder="例：xxx mm">
          </div>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>灯具宽度</label>
            <input type="text" name="light_width" placeholder="例：300mm">
          </div>
          <div class="form-group">
            <label>内部宽度</label>
            <input type="text" name="interior_width" placeholder="例：3900mm">
          </div>
        </div>
        
        <div class="form-group">
          <label>内部长度</label>
          <input type="text" name="interior_length" placeholder="例：6900mm">
        </div>
      </div>

      <!-- 三、地坑尺寸 -->
      <div class="section">
        <div class="section-title">三、地坑尺寸</div>
        <div class="hint" style="margin-bottom:12px;">测量方法：测量地坑底部到格栅顶部的距离，共6个测量点</div>
        
        <div class="row-3">
          <div class="form-group">
            <label>深度测量点1</label>
            <input type="text" name="pit_depth_1" placeholder="例：300mm">
          </div>
          <div class="form-group">
            <label>深度测量点2</label>
            <input type="text" name="pit_depth_2" placeholder="例：300mm">
          </div>
          <div class="form-group">
            <label>深度测量点3</label>
            <input type="text" name="pit_depth_3" placeholder="例：300mm">
          </div>
        </div>
        <div class="row-3">
          <div class="form-group">
            <label>深度测量点4</label>
            <input type="text" name="pit_depth_4" placeholder="例：300mm">
          </div>
          <div class="form-group">
            <label>深度测量点5</label>
            <input type="text" name="pit_depth_5" placeholder="例：300mm">
          </div>
          <div class="form-group">
            <label>深度测量点6</label>
            <input type="text" name="pit_depth_6" placeholder="例：300mm">
          </div>
        </div>
        
        <div class="row">
          <div class="form-group">
            <label>地坑宽度</label>
            <input type="text" name="pit_width" placeholder="例：550mm">
          </div>
          <div class="form-group">
            <label>墙边筋宽度</label>
            <input type="text" name="edge_bar_width" placeholder="例：20mm">
          </div>
        </div>

        <!-- 水泥墩 -->
        <div class="radio-group">
          <label><input type="radio" name="has_pier" value="yes" onchange="toggleSection('pier', true)"> 有水泥墩</label>
          <label><input type="radio" name="has_pier" value="no" onchange="toggleSection('pier', false)" checked> 无</label>
        </div>
        <div class="conditional-section" id="pierSection">
          <div class="row">
            <div class="form-group">
              <label>水泥墩长度</label>
              <input type="text" name="concrete_pier_length" placeholder="例：400mm">
            </div>
            <div class="form-group">
              <label>水泥墩高度</label>
              <input type="text" name="concrete_pier_height" placeholder="例：250mm">
            </div>
          </div>
        </div>

        <!-- 斜坡 -->
        <div class="radio-group">
          <label><input type="radio" name="has_ramp" value="yes" onchange="toggleSection('ramp', true)"> 有斜坡</label>
          <label><input type="radio" name="has_ramp" value="no" onchange="toggleSection('ramp', false)" checked> 无</label>
        </div>
        <div class="conditional-section" id="rampSection">
          <div class="row">
            <div class="form-group">
              <label>平面斜坡长度</label>
              <input type="text" name="ramp_length" placeholder="例：1000mm">
            </div>
            <div class="form-group">
              <label>斜坡高度</label>
              <input type="text" name="ramp_height" placeholder="例：100mm">
            </div>
          </div>
        </div>
      </div>

      <!-- 备注 -->
      <div class="form-group">
        <label>备注</label>
        <textarea name="remarks" placeholder="其他需要说明的事项、照片说明等"></textarea>
      </div>

      <button type="submit" id="submitBtn">提交勘测记录</button>
    </form>
  </div>

  <!-- 图片预览模态框 -->
  <div class="img-preview-modal" id="imgPreviewModal" onclick="closeImgPreview()">
    <button class="close-btn" onclick="closeImgPreview()">×</button>
    <img id="previewImg" src="" alt="预览">
  </div>

  <script>
    const form = document.getElementById('surveyForm');
    const toast = document.getElementById('toast');
    const submitBtn = document.getElementById('submitBtn');

    // 图片存储：{ booth: [base64...], air: [...], power: [...] }
    const photoStore = { booth: [], air: [], power: [] };

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // 图片压缩（最大宽高1280px，质量0.7）
    function compressImage(file, maxSize = 1280, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxSize || height > maxSize) {
              if (width > height) {
                height = Math.round(height * maxSize / width);
                width = maxSize;
              } else {
                width = Math.round(width * maxSize / height);
                height = maxSize;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 处理图片上传
    async function handlePhotoUpload(input, category) {
      const files = Array.from(input.files);
      if (files.length === 0) return;
      const listId = category + 'ThumbList';
      const list = document.getElementById(listId);

      for (const file of files) {
        try {
          const dataUrl = await compressImage(file);
          const idx = photoStore[category].length;
          photoStore[category].push(dataUrl);

          const div = document.createElement('div');
          div.className = 'thumb-item';
          div.innerHTML = `
            <img src="${dataUrl}" onclick="previewImg('${category}', ${idx})" alt="照片">
            <button class="thumb-del" onclick="removePhoto('${category}', ${idx})">×</button>
          `;
          list.appendChild(div);
        } catch (err) {
          showToast('图片处理失败', 'error');
        }
      }
      input.value = '';
    }

    // 删除图片
    function removePhoto(category, idx) {
      photoStore[category].splice(idx, 1);
      renderThumbList(category);
    }

    // 重新渲染缩略图列表
    function renderThumbList(category) {
      const list = document.getElementById(category + 'ThumbList');
      list.innerHTML = '';
      photoStore[category].forEach((dataUrl, i) => {
        const div = document.createElement('div');
        div.className = 'thumb-item';
        div.innerHTML = `
          <img src="${dataUrl}" onclick="previewImg('${category}', ${i})" alt="照片">
          <button class="thumb-del" onclick="removePhoto('${category}', ${i})">×</button>
        `;
        list.appendChild(div);
      });
    }

    // 预览大图
    function previewImg(category, idx) {
      document.getElementById('previewImg').src = photoStore[category][idx];
      document.getElementById('imgPreviewModal').classList.add('active');
    }
    function closeImgPreview() {
      document.getElementById('imgPreviewModal').classList.remove('active');
    }

    // 条件选填区域切换
    function toggleSection(name, show) {
      const section = document.getElementById(name + 'Section');
      if (section) {
        if (show) {
          section.classList.add('visible');
        } else {
          section.classList.remove('visible');
          // 清空隐藏区域的输入值
          section.querySelectorAll('input, textarea').forEach(el => { el.value = ''; });
        }
      }
    }

    // 页面加载时校验邀请码
    async function checkInviteCode() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        document.getElementById('invalidPage').style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/verify-code?code=' + encodeURIComponent(code));
        const data = await res.json();

        if (data.valid) {
          document.getElementById('formContainer').style.display = 'block';
          document.getElementById('inviteCode').value = data.code;
          document.getElementById('customerBanner').innerHTML =
            '客户：<strong>' + data.customer_name + '</strong>';
          document.title = '现场喷房勘测 - ' + data.customer_name;
        } else {
          document.getElementById('invalidPage').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('invalidPage').style.display = 'block';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      // 合并所有分类的图片到 photos 数组
      const allPhotos = [
        ...photoStore.booth.map((d, i) => ({ category: 'booth', index: i, data: d })),
        ...photoStore.air.map((d, i) => ({ category: 'air', index: i, data: d })),
        ...photoStore.power.map((d, i) => ({ category: 'power', index: i, data: d }))
      ];
      data.photos = allPhotos.map(p => p.data); // 只存 base64 数组

      // 校验：喷房照片必填
      if (photoStore.booth.length === 0) {
        showToast('请至少上传一张喷房现场照片', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '提交勘测记录';
        return;
      }

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (res.ok) {
          showToast('提交成功！', 'success');
          form.reset();
          // 清空图片
          photoStore.booth = [];
          photoStore.air = [];
          photoStore.power = [];
          renderThumbList('booth');
          renderThumbList('air');
          renderThumbList('power');
          document.getElementById('inviteCode').value = data.invite_code;
          window.scrollTo(0, 0);
        } else {
          showToast(result.error || '提交失败', 'error');
        }
      } catch (err) {
        showToast('网络错误，请重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交勘测记录';
      }
    });

    checkInviteCode();
  </script>
</body>
</html>
