<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喷房作业数据采集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 24px;
      color: #1a73e8;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }
    label .required { color: #e53935; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }
    textarea { resize: vertical; min-height: 60px; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a73e8;
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8f0fe;
    }
    .quality-options {
      display: flex;
      gap: 12px;
    }
    .quality-options label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-weight: normal;
    }
    .quality-options input[type="radio"] {
      width: auto;
    }
    .quality-options label:has(input:checked) {
      border-color: #1a73e8;
      background: #e8f0fe;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      z-index: 1000;
      display: none;
    }
    .toast.success { background: #43a047; }
    .toast.error { background: #e53935; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="container">
    <h1>喷房作业数据采集</h1>
    <form id="sprayForm">
      <div class="section-title">基本信息</div>
      <div class="row">
        <div class="form-group">
          <label>喷房编号 <span class="required">*</span></label>
          <select name="booth_number" required>
            <option value="">请选择</option>
            <option value="1号喷房">1号喷房</option>
            <option value="2号喷房">2号喷房</option>
            <option value="3号喷房">3号喷房</option>
            <option value="4号喷房">4号喷房</option>
            <option value="5号喷房">5号喷房</option>
          </select>
        </div>
        <div class="form-group">
          <label>操作员 <span class="required">*</span></label>
          <input type="text" name="operator_name" placeholder="请输入姓名" required>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>产品名称</label>
          <input type="text" name="product_name" placeholder="如：汽车保险杠">
        </div>
        <div class="form-group">
          <label>颜色编码</label>
          <input type="text" name="color_code" placeholder="如：R-9016">
        </div>
      </div>
      <div class="form-group">
        <label>涂料类型</label>
        <select name="coating_type">
          <option value="">请选择</option>
          <option value="底漆">底漆</option>
          <option value="色漆">色漆</option>
          <option value="清漆">清漆</option>
          <option value="粉末涂料">粉末涂料</option>
        </select>
      </div>

      <div class="section-title">喷涂参数</div>
      <div class="row">
        <div class="form-group">
          <label>电压 (kV)</label>
          <input type="text" name="voltage" placeholder="如：60">
        </div>
        <div class="form-group">
          <label>电流 (μA)</label>
          <input type="text" name="current" placeholder="如：35">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>流量 (cc/min)</label>
          <input type="text" name="flow_rate" placeholder="如：150">
        </div>
        <div class="form-group">
          <label>雾化压力 (bar)</label>
          <input type="text" name="spray_pressure" placeholder="如：2.5">
        </div>
      </div>
      <div class="form-group">
        <label>膜厚 (μm)</label>
        <input type="text" name="thickness" placeholder="如：60-80">
      </div>

      <div class="section-title">质量检查</div>
      <div class="form-group">
        <label>质量结果</label>
        <div class="quality-options">
          <label><input type="radio" name="quality_result" value="合格" checked> 合格</label>
          <label><input type="radio" name="quality_result" value="不合格"> 不合格</label>
          <label><input type="radio" name="quality_result" value="返工"> 返工</label>
        </div>
      </div>
      <div class="form-group">
        <label>缺陷描述</label>
        <textarea name="defect_description" placeholder="如：流挂、橘皮、针孔等（不合格时填写）"></textarea>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea name="remarks" placeholder="其他需要说明的事项"></textarea>
      </div>

      <button type="submit" id="submitBtn">提交记录</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('sprayForm');
    const toast = document.getElementById('toast');
    const submitBtn = document.getElementById('submitBtn');

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (res.ok) {
          showToast('提交成功！', 'success');
          form.reset();
        } else {
          showToast(result.error || '提交失败', 'error');
        }
      } catch (err) {
        showToast('网络错误，请重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交记录';
      }
    });
  </script>
</body>
</html>
