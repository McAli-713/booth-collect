services:
  - type: web
    name: spray-booth-collector
    runtime: node
    buildCommand: npm install
    startCommand: node --dns-result-order=ipv4first server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: PORT
        value: 3000
